<!DOCTYPE html>
<html lang="ro"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>
        Editează utilizator
    </title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}">
</div>

<div class="container">

    <h1>
        Editează utilizator
    </h1>

    <p class="page-subtitle">
        Poți modifica datele utilizatorului și rolul acestuia.
        Parola este gestionată doar de utilizator.
    </p>

    <form th:action="@{/users/{id}(id=${user.id})}"
          th:object="${user}"
          method="post">

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input type="text"
                   id="username"
                   th:field="*{username}"
                   required>

        </div>

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input type="email"
                   id="email"
                   th:field="*{email}"
                   required>

        </div>

        <div class="form-group">

            <label for="role">
                Rol
            </label>

            <select id="role"
                    th:field="*{role}"
                    required>

                <option th:each="role : ${roles}"
                        th:value="${role}"
                        th:text="${role}">
                </option>

            </select>

        </div>

        <button type="submit"
                class="button">
            Salvează modificările
        </button>

        <a th:href="@{/users}"
           class="button button-secondary">
            Anulează
        </a>

    </form>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ro"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Înregistrare - Library Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container login-container">

    <div class="login-card">

        <h1>LibraryManagement</h1>

        <h2>Creează cont</h2>

        <p>
            Completează datele pentru a crea un cont nou.
        </p>

        <div class="error-message"
             th:if="${registerError}"
             th:text="${registerError}">
        </div>

        <form th:action="@{/register}"
              th:object="${user}"
              method="post">

            <input type="hidden"
                   th:field="*{role}">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input type="text"
                       id="username"
                       th:field="*{username}"
                       required>

                <p class="error-message"
                   th:if="${#fields.hasErrors('username')}"
                   th:errors="*{username}">
                </p>

            </div>

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input type="email"
                       id="email"
                       th:field="*{email}"
                       required>

                <p class="error-message"
                   th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}">
                </p>

            </div>

            <div class="form-group">

                <label for="password">
                    Parolă
                </label>

                <input type="password"
                       id="password"
                       th:field="*{password}"
                       required>

                <p class="error-message"
                   th:if="${#fields.hasErrors('password')}"
                   th:errors="*{password}">
                </p>

            </div>

            <button type="submit"
                    class="button">
                Creează cont
            </button>

            <a th:href="@{/login}"
               class="button button-secondary">
                Înapoi la login
            </a>

        </form>

    </div>

</div>

</body>

</html>

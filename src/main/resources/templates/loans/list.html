<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Împrumuturi - Library Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <h1>Împrumuturi</h1>

    <a th:href="@{/loans/new}" class="button">
        + Adaugă împrumut
    </a>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Utilizator</th>
            <th>Carte</th>
            <th>Data împrumut</th>
            <th>Termen</th>
            <th>Data returnării</th>
            <th>Status</th>
            <th>Acțiuni</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="loan : ${loans}">
            <td th:text="${loan.id}"></td>

            <td th:text="${loan.user.username}"></td>

            <td th:text="${loan.book.title}"></td>

            <td th:text="${loan.loanDate}"></td>

            <td th:text="${loan.dueDate}"></td>

            <td th:text="${loan.returnDate != null ? loan.returnDate : '-'}"></td>

            <td th:text="${loan.status}"></td>

            <td>

                <form th:if="${loan.status.name() != 'RETURNED'}"
                      th:action="@{/loans/{id}/return(id=${loan.id})}"
                      method="post"
                      style="display: inline;">

                    <button type="submit"
                            class="button">
                        Returnează
                    </button>

                </form>

                <form th:if="${loan.status.name() == 'RETURNED'}"
                      th:action="@{/loans/{id}/delete(id=${loan.id})}"
                      method="post"
                      style="display: inline;">

                    <button type="submit"
                            class="button button-danger"
                            onclick="return confirm('Sigur vrei să ștergi acest împrumut?')">
                        Șterge
                    </button>

                </form>

            </td>
        </tr>

        </tbody>
    </table>

    <p class="empty-message"
       th:if="${#lists.isEmpty(loans)}">
        Nu există împrumuturi înregistrate.
    </p>

</div>

</body>
</html>

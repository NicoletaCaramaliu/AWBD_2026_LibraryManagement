<!DOCTYPE html>
<html lang="ro"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Autori - Library Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">

    <div class="page-header">

        <div>
            <h1>Autori</h1>

            <p class="page-subtitle">
                Gestionează autorii disponibili în bibliotecă.
            </p>
        </div>

        <a th:href="@{/authors/new}"
           class="button"
           sec:authorize="hasRole('ADMIN')">
            + Adaugă autor
        </a>

    </div>

    <!-- FILTRE -->
    <form method="get"
          th:action="@{/authors}"
          class="filter-card">

        <div class="filter-group">

            <label for="sortBy">
                Sortează după:
            </label>

            <select id="sortBy"
                    name="sortBy"
                    class="filter-select">

                <option value="id"
                        th:selected="${sortBy == 'id'}">
                    ID
                </option>

                <option value="firstName"
                        th:selected="${sortBy == 'firstName'}">
                    Prenume
                </option>

                <option value="lastName"
                        th:selected="${sortBy == 'lastName'}">
                    Nume
                </option>

            </select>

        </div>

        <div class="filter-group">

            <label for="direction">
                Ordine:
            </label>

            <select id="direction"
                    name="direction"
                    class="filter-select">

                <option value="asc"
                        th:selected="${direction == 'asc'}">
                    Crescător
                </option>

                <option value="desc"
                        th:selected="${direction == 'desc'}">
                    Descrescător
                </option>

            </select>

        </div>

        <div class="filter-group">

            <label for="size">
                Autori pe pagină:
            </label>

            <select id="size"
                    name="size"
                    class="filter-select">

                <option value="5"
                        th:selected="${pageSize == 5}">
                    5
                </option>

                <option value="10"
                        th:selected="${pageSize == 10}">
                    10
                </option>

                <option value="20"
                        th:selected="${pageSize == 20}">
                    20
                </option>

            </select>

        </div>

        <div class="filter-button-group">

            <button type="submit"
                    class="button filter-button">
                Aplică
            </button>

        </div>

    </form>

    <!-- TABEL -->
    <table>

        <thead>
        <tr>
            <th>ID</th>
            <th>Prenume</th>
            <th>Nume</th>

            <th sec:authorize="hasRole('ADMIN')">
                Acțiuni
            </th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="author : ${authors}">

            <td th:text="${author.id}"></td>

            <td th:text="${author.firstName}"></td>

            <td th:text="${author.lastName}"></td>

            <td sec:authorize="hasRole('ADMIN')">

                <a th:href="@{/authors/{id}/edit(id=${author.id})}"
                   class="button">
                    Editează
                </a>

                <form th:action="@{/authors/{id}/delete(id=${author.id})}"
                      method="post"
                      style="display: inline;">

                    <button type="submit"
                            class="button button-danger"
                            onclick="return confirm('Sigur vrei să ștergi acest autor?')">

                        Șterge

                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>

    <p class="empty-message"
       th:if="${#lists.isEmpty(authors)}">

        Nu există autori înregistrați.

    </p>

    <!-- INFO PAGINARE -->
    <div class="pagination-info"
         th:if="${authorPage.totalElements > 0}">

        Pagina
        <strong th:text="${currentPage + 1}"></strong>

        din

        <strong th:text="${authorPage.totalPages}"></strong>

        <span class="pagination-separator">
            •
        </span>

        Total autori:

        <strong th:text="${authorPage.totalElements}"></strong>

    </div>

    <!-- PAGINARE -->
    <div class="pagination"
         th:if="${authorPage.totalPages > 0}">

        <a th:if="${authorPage.hasPrevious()}"
           th:href="@{/authors(
                page=${currentPage - 1},
                size=${pageSize},
                sortBy=${sortBy},
                direction=${direction}
           )}"
           class="page-button page-navigation">

            ← Anterior

        </a>

        <span th:unless="${authorPage.hasPrevious()}"
              class="page-button page-navigation disabled">

            ← Anterior

        </span>

        <span th:each="pageNumber :
                ${#numbers.sequence(
                    0,
                    authorPage.totalPages - 1
                )}">

            <a th:if="${pageNumber != currentPage}"
               th:href="@{/authors(
                    page=${pageNumber},
                    size=${pageSize},
                    sortBy=${sortBy},
                    direction=${direction}
               )}"
               class="page-button"
               th:text="${pageNumber + 1}">
            </a>

            <span th:if="${pageNumber == currentPage}"
                  class="page-button active-page"
                  th:text="${pageNumber + 1}">
            </span>

        </span>

        <a th:if="${authorPage.hasNext()}"
           th:href="@{/authors(
                page=${currentPage + 1},
                size=${pageSize},
                sortBy=${sortBy},
                direction=${direction}
           )}"
           class="page-button page-navigation">

            Următor →

        </a>

        <span th:unless="${authorPage.hasNext()}"
              class="page-button page-navigation disabled">

            Următor →

        </span>

    </div>

</div>

</body>

</html>

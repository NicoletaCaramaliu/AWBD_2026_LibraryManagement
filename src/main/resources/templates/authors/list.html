<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Autori - Library Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">

    <h1>Autori</h1>

    <a th:href="@{/authors/new}" class="button">
        + Adaugă autor
    </a>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Prenume</th>
            <th>Nume</th>
            <th>Acțiuni</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="author : ${authors}">
            <td th:text="${author.id}"></td>
            <td th:text="${author.firstName}"></td>
            <td th:text="${author.lastName}"></td>
            <td>
                <a th:href="@{/authors/{id}/edit(id=${author.id})}"
                   class="button">
                    Editează
                </a>

                <form th:action="@{/authors/{id}/delete(id=${author.id})}"
                      method="post"
                      style="display: inline;">
                    <button type="submit"
                            class="button button-danger"
                            onclick="return confirm('Sigur vrei să ștergi acest autor?')">
                        Șterge
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <p class="empty-message"
       th:if="${#lists.isEmpty(authors)}">
        Nu există autori înregistrați.
    </p>

</div>

</body>
</html>

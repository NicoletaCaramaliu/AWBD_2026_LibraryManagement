<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Adaugă autor - Library Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <h1>Adaugă autor</h1>

    <form th:action="@{/authors}"
          th:object="${author}"
          method="post">

        <div class="form-group">
            <label for="firstName">Prenume</label>

            <input type="text"
                   id="firstName"
                   th:field="*{firstName}"
                   required>

            <p class="error-message"
               th:if="${#fields.hasErrors('firstName')}"
               th:errors="*{firstName}">
            </p>
        </div>

        <div class="form-group">
            <label for="lastName">Nume</label>

            <input type="text"
                   id="lastName"
                   th:field="*{lastName}"
                   required>

            <p class="error-message"
               th:if="${#fields.hasErrors('lastName')}"
               th:errors="*{lastName}">
            </p>
        </div>

        <button type="submit" class="button">
            Salvează
        </button>

        <a th:href="@{/authors}" class="button button-secondary">
            Anulează
        </a>

    </form>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${category.id == null ? 'Adaugă categorie' : 'Editează categorie'}">
        Categorie
    </title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <h1 th:text="${category.id == null ? 'Adaugă categorie' : 'Editează categorie'}">
        Categorie
    </h1>

    <!-- CREATE -->
    <form th:if="${category.id == null}"
          th:action="@{/categories}"
          th:object="${category}"
          method="post">

        <div class="form-group">
            <label for="nameCreate">Nume</label>
            <input type="text"
                   id="nameCreate"
                   th:field="*{name}"
                   required>

            <p class="error-message"
               th:if="${#fields.hasErrors('name')}"
               th:errors="*{name}">
            </p>
        </div>

        <div class="form-group">
            <label for="descriptionCreate">Descriere</label>
            <input type="text"
                   id="descriptionCreate"
                   th:field="*{description}">
        </div>

        <button type="submit" class="button">Salvează</button>
        <a th:href="@{/categories}" class="button button-secondary">Anulează</a>

    </form>

    <!-- EDIT -->
    <form th:unless="${category.id == null}"
          th:action="@{/categories/{id}(id=${category.id})}"
          th:object="${category}"
          method="post">

        <div class="form-group">
            <label for="nameEdit">Nume</label>
            <input type="text"
                   id="nameEdit"
                   th:field="*{name}"
                   required>

            <p class="error-message"
               th:if="${#fields.hasErrors('name')}"
               th:errors="*{name}">
            </p>
        </div>

        <div class="form-group">
            <label for="descriptionEdit">Descriere</label>
            <input type="text"
                   id="descriptionEdit"
                   th:field="*{description}">
        </div>

        <button type="submit" class="button">Salvează modificările</button>
        <a th:href="@{/categories}" class="button button-secondary">Anulează</a>

    </form>

</div>

</body>
</html>

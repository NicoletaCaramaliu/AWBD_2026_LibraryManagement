<!DOCTYPE html>
<html lang="ro"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Cărți - Library Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">

    <div class="page-header">
        <div>
            <h1>Cărți</h1>
            <p class="page-subtitle">
                Gestionează colecția de cărți din bibliotecă.
            </p>
        </div>

        <a th:href="@{/books/new}"
           class="button"
           sec:authorize="hasRole('ADMIN')">
            + Adaugă carte
        </a>
    </div>

    <!-- FILTRE -->
    <form method="get"
          th:action="@{/books}"
          class="filter-card">

        <div class="filter-group">
            <label for="sortBy">Sortează după:</label>

            <select id="sortBy"
                    name="sortBy"
                    class="filter-select">

                <option value="title"
                        th:selected="${sortBy == 'title'}">
                    Titlu
                </option>

                <option value="price"
                        th:selected="${sortBy == 'price'}">
                    Preț
                </option>

            </select>
        </div>

        <div class="filter-group">
            <label for="direction">Ordine:</label>

            <select id="direction"
                    name="direction"
                    class="filter-select">

                <option value="asc"
                        th:selected="${direction == 'asc'}">
                    Crescător
                </option>

                <option value="desc"
                        th:selected="${direction == 'desc'}">
                    Descrescător
                </option>

            </select>
        </div>

        <div class="filter-group">
            <label for="size">Cărți pe pagină:</label>

            <select id="size"
                    name="size"
                    class="filter-select">

                <option value="5"
                        th:selected="${pageSize == 5}">
                    5
                </option>

                <option value="10"
                        th:selected="${pageSize == 10}">
                    10
                </option>

                <option value="20"
                        th:selected="${pageSize == 20}">
                    20
                </option>

            </select>
        </div>

        <div class="filter-button-group">
            <button type="submit"
                    class="button filter-button">
                Aplică
            </button>
        </div>

    </form>

    <!-- TABEL -->
    <table>

        <thead>
        <tr>
            <th>ID</th>
            <th>Titlu</th>
            <th>Preț</th>
            <th>Stoc</th>
            <th>Editură</th>
            <th>ISBN</th>

            <th sec:authorize="hasRole('ADMIN')">
                Acțiuni
            </th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="book : ${books}">

            <td th:text="${book.id}"></td>
            <td>
                <div class="book-title-hover">
        <span class="book-title"
              th:text="${book.title}">
        </span>

                    <div class="book-details-tooltip"
                         th:if="${book.bookDetails != null}">

                        <div class="tooltip-header">
                            Detalii carte
                        </div>

                        <div class="tooltip-row">
                            <strong>ISBN:</strong>
                            <span th:text="${book.bookDetails.isbn}"></span>
                        </div>

                        <div class="tooltip-row">
                            <strong>Număr pagini:</strong>
                            <span th:text="${book.bookDetails.numberOfPages}"></span>
                        </div>

                        <div class="tooltip-row">
                            <strong>Limbă:</strong>
                            <span th:text="${book.bookDetails.language}"></span>
                        </div>

                        <div class="tooltip-row">
                            <strong>An publicare:</strong>
                            <span th:text="${book.bookDetails.publicationYear}"></span>
                        </div>

                        <div class="tooltip-description">
                            <strong>Descriere:</strong>
                            <span th:text="${book.bookDetails.description != null
                        and !#strings.isEmpty(book.bookDetails.description)
                        ? book.bookDetails.description
                        : 'Fără descriere'}">
                </span>
                        </div>

                    </div>
                </div>
            </td>
            <td th:text="${book.price}"></td>
            <td th:text="${book.stock}"></td>
            <td th:text="${book.publisher.name}"></td>
            <td th:text="${book.bookDetails.isbn}"></td>

            <td sec:authorize="hasRole('ADMIN')">

                <a th:href="@{/books/{id}/edit(id=${book.id})}"
                   class="button">
                    Editează
                </a>

                <form th:action="@{/books/{id}/delete(id=${book.id})}"
                      method="post"
                      style="display: inline;">

                    <button type="submit"
                            class="button button-danger"
                            onclick="return confirm('Sigur vrei să ștergi această carte?')">
                        Șterge
                    </button>

                </form>

            </td>

        </tr>

        </tbody>
    </table>

    <p class="empty-message"
       th:if="${#lists.isEmpty(books)}">
        Nu există cărți înregistrate.
    </p>

    <!-- INFO PAGINARE -->
    <div class="pagination-info"
         th:if="${bookPage.totalElements > 0}">

        Pagina
        <strong th:text="${currentPage + 1}"></strong>
        din
        <strong th:text="${bookPage.totalPages}"></strong>

        <span class="pagination-separator">•</span>

        Total cărți:
        <strong th:text="${bookPage.totalElements}"></strong>

    </div>

    <!-- PAGINARE -->
    <div class="pagination"
         th:if="${bookPage.totalPages > 0}">

        <a th:if="${bookPage.hasPrevious()}"
           th:href="@{/books(
                page=${currentPage - 1},
                size=${pageSize},
                sortBy=${sortBy},
                direction=${direction}
           )}"
           class="page-button page-navigation">
            ← Anterior
        </a>

        <span th:unless="${bookPage.hasPrevious()}"
              class="page-button page-navigation disabled">
            ← Anterior
        </span>

        <span th:each="pageNumber :
                ${#numbers.sequence(
                    0,
                    bookPage.totalPages - 1
                )}">

            <a th:if="${pageNumber != currentPage}"
               th:href="@{/books(
                    page=${pageNumber},
                    size=${pageSize},
                    sortBy=${sortBy},
                    direction=${direction}
               )}"
               class="page-button"
               th:text="${pageNumber + 1}">
            </a>

            <span th:if="${pageNumber == currentPage}"
                  class="page-button active-page"
                  th:text="${pageNumber + 1}">
            </span>

        </span>

        <a th:if="${bookPage.hasNext()}"
           th:href="@{/books(
                page=${currentPage + 1},
                size=${pageSize},
                sortBy=${sortBy},
                direction=${direction}
           )}"
           class="page-button page-navigation">
            Următor →
        </a>

        <span th:unless="${bookPage.hasNext()}"
              class="page-button page-navigation disabled">
            Următor →
        </span>

    </div>

</div>

</body>
</html>

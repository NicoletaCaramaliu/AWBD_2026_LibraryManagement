<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title th:text="${book.id == null ? 'Adaugă carte' : 'Editează carte'}">
        Carte
    </title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">

    <h1 th:text="${book.id == null ? 'Adaugă carte' : 'Editează carte'}">
        Carte
    </h1>

    <!-- CREATE -->
    <form th:if="${book.id == null}"
          th:action="@{/books}"
          th:object="${book}"
          method="post">

        <div class="form-group">
            <label for="titleCreate">Titlu</label>

            <input type="text"
                   id="titleCreate"
                   th:field="*{title}"
                   required>

            <p class="error-message"
               th:if="${#fields.hasErrors('title')}"
               th:errors="*{title}">
            </p>
        </div>

        <div class="form-group">
            <label for="priceCreate">Preț</label>

            <input type="number"
                   id="priceCreate"
                   th:field="*{price}"
                   min="0"
                   step="0.01"
                   required>

            <p class="error-message"
               th:if="${#fields.hasErrors('price')}"
               th:errors="*{price}">
            </p>
        </div>

        <div class="form-group">
            <label for="stockCreate">Stoc</label>

            <input type="number"
                   id="stockCreate"
                   th:field="*{stock}"
                   min="0"
                   required>

            <p class="error-message"
               th:if="${#fields.hasErrors('stock')}"
               th:errors="*{stock}">
            </p>
        </div>

        <div class="form-group">
            <label for="publisherCreate">Editură</label>

            <select id="publisherCreate"
                    th:field="*{publisher.id}"
                    required>

                <option value="">
                    -- Selectează editura --
                </option>

                <option th:each="publisher : ${publishers}"
                        th:value="${publisher.id}"
                        th:text="${publisher.name}">
                </option>

            </select>
        </div>

        <h2>Detalii carte</h2>

        <div class="form-group">
            <label for="isbnCreate">ISBN</label>

            <input type="text"
                   id="isbnCreate"
                   th:field="*{bookDetails.isbn}"
                   required>

            <p class="error-message"
               th:if="${#fields.hasErrors('bookDetails.isbn')}"
               th:errors="*{bookDetails.isbn}">
            </p>
        </div>

        <div class="form-group">
            <label for="pagesCreate">Număr pagini</label>

            <input type="number"
                   id="pagesCreate"
                   th:field="*{bookDetails.numberOfPages}"
                   min="1"
                   required>

            <p class="error-message"
               th:if="${#fields.hasErrors('bookDetails.numberOfPages')}"
               th:errors="*{bookDetails.numberOfPages}">
            </p>
        </div>

        <div class="form-group">
            <label for="languageCreate">Limbă</label>

            <input type="text"
                   id="languageCreate"
                   th:field="*{bookDetails.language}"
                   required>

            <p class="error-message"
               th:if="${#fields.hasErrors('bookDetails.language')}"
               th:errors="*{bookDetails.language}">
            </p>
        </div>

        <div class="form-group">
            <label for="yearCreate">An publicare</label>

            <input type="number"
                   id="yearCreate"
                   th:field="*{bookDetails.publicationYear}"
                   required>

            <p class="error-message"
               th:if="${#fields.hasErrors('bookDetails.publicationYear')}"
               th:errors="*{bookDetails.publicationYear}">
            </p>
        </div>

        <div class="form-group">
            <label for="descriptionCreate">Descriere</label>

            <input type="text"
                   id="descriptionCreate"
                   th:field="*{bookDetails.description}">
        </div>

        <div class="form-group">
            <label for="authorIdsCreate">Autori</label>

            <select id="authorIdsCreate"
                    name="authorIds"
                    multiple>

                <option th:each="author : ${authors}"
                        th:value="${author.id}"
                        th:text="${author.firstName + ' ' + author.lastName}">
                </option>

            </select>
        </div>

        <div class="form-group">
            <label for="categoryIdsCreate">Categorii</label>

            <select id="categoryIdsCreate"
                    name="categoryIds"
                    multiple>

                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}">
                </option>

            </select>
        </div>

        <button type="submit" class="button">
            Salvează
        </button>

        <a th:href="@{/books}"
           class="button button-secondary">
            Anulează
        </a>

    </form>

    <!-- EDIT -->
    <form th:unless="${book.id == null}"
          th:action="@{/books/{id}(id=${book.id})}"
          th:object="${book}"
          method="post">

        <div class="form-group">
            <label for="titleEdit">Titlu</label>

            <input type="text"
                   id="titleEdit"
                   th:field="*{title}"
                   required>

            <p class="error-message"
               th:if="${#fields.hasErrors('title')}"
               th:errors="*{title}">
            </p>
        </div>

        <div class="form-group">
            <label for="priceEdit">Preț</label>

            <input type="number"
                   id="priceEdit"
                   th:field="*{price}"
                   min="0"
                   step="0.01"
                   required>

            <p class="error-message"
               th:if="${#fields.hasErrors('price')}"
               th:errors="*{price}">
            </p>
        </div>

        <div class="form-group">
            <label for="stockEdit">Stoc</label>

            <input type="number"
                   id="stockEdit"
                   th:field="*{stock}"
                   min="0"
                   required>

            <p class="error-message"
               th:if="${#fields.hasErrors('stock')}"
               th:errors="*{stock}">
            </p>
        </div>

        <div class="form-group">
            <label for="publisherEdit">Editură</label>

            <select id="publisherEdit"
                    th:field="*{publisher.id}"
                    required>

                <option value="">
                    -- Selectează editura --
                </option>

                <option th:each="publisher : ${publishers}"
                        th:value="${publisher.id}"
                        th:text="${publisher.name}">
                </option>

            </select>
        </div>

        <h2>Detalii carte</h2>

        <div class="form-group">
            <label for="isbnEdit">ISBN</label>

            <input type="text"
                   id="isbnEdit"
                   th:field="*{bookDetails.isbn}"
                   required>

            <p class="error-message"
               th:if="${#fields.hasErrors('bookDetails.isbn')}"
               th:errors="*{bookDetails.isbn}">
            </p>
        </div>

        <div class="form-group">
            <label for="pagesEdit">Număr pagini</label>

            <input type="number"
                   id="pagesEdit"
                   th:field="*{bookDetails.numberOfPages}"
                   min="1"
                   required>

            <p class="error-message"
               th:if="${#fields.hasErrors('bookDetails.numberOfPages')}"
               th:errors="*{bookDetails.numberOfPages}">
            </p>
        </div>

        <div class="form-group">
            <label for="languageEdit">Limbă</label>

            <input type="text"
                   id="languageEdit"
                   th:field="*{bookDetails.language}"
                   required>

            <p class="error-message"
               th:if="${#fields.hasErrors('bookDetails.language')}"
               th:errors="*{bookDetails.language}">
            </p>
        </div>

        <div class="form-group">
            <label for="yearEdit">An publicare</label>

            <input type="number"
                   id="yearEdit"
                   th:field="*{bookDetails.publicationYear}"
                   required>

            <p class="error-message"
               th:if="${#fields.hasErrors('bookDetails.publicationYear')}"
               th:errors="*{bookDetails.publicationYear}">
            </p>
        </div>

        <div class="form-group">
            <label for="descriptionEdit">Descriere</label>

            <input type="text"
                   id="descriptionEdit"
                   th:field="*{bookDetails.description}">
        </div>

        <div class="form-group">
            <label for="authorIdsEdit">Autori</label>

            <select id="authorIdsEdit"
                    name="authorIds"
                    multiple>

                <option th:each="author : ${authors}"
                        th:value="${author.id}"
                        th:text="${author.firstName + ' ' + author.lastName}"
                        th:selected="${book.authors != null and book.authors.contains(author)}">
                </option>

            </select>
        </div>

        <div class="form-group">
            <label for="categoryIdsEdit">Categorii</label>

            <select id="categoryIdsEdit"
                    name="categoryIds"
                    multiple>

                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}"
                        th:selected="${book.categories != null and book.categories.contains(category)}">
                </option>

            </select>
        </div>

        <button type="submit" class="button">
            Salvează modificările
        </button>

        <a th:href="@{/books}"
           class="button button-secondary">
            Anulează
        </a>

    </form>

</div>

</body>
</html>
